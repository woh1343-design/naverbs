<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>브랜드검색 소재 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Light-only by request. Layout: 3-pane workbench — plan list · editor · sticky phone preview; stacks to one column on phones */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9edeb; --line:#d5dcd9; --fg:#18201d; --muted:#5d6a65;
  --accent:#0f6b54; --accent-weak:#dcefe8; --accent-fg:#ffffff;
  --ok:#1f7a43; --ok-bg:#e1f3e7; --warn:#9a5b00; --warn-bg:#fbefd9; --bad:#b4232c; --bad-bg:#fbe2e3; --info-bg:#e4ecf7; --info:#2a5490;
  --phone:#ffffff; --phone-fg:#1b1b1b; --phone-muted:#6f6f6f; --phone-link:#1a4fc4; --phone-line:#e7e7e7; --phone-chip:#f3f4f6;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1440px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:220px minmax(0,1fr)}.preview-col{grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}

/* plan list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .filters{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.list .filters input,.list .filters select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:12.5px}
.list ul{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto}
.list li.lrow2{position:relative}
.list li.lrow2 .del{position:absolute;right:6px;top:8px;width:26px;height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;opacity:.55;z-index:1}
.list li.lrow2:hover .del,.list li.lrow2 .del:focus-visible{opacity:1}
.list li.lrow2 .del:hover{background:var(--bad-bg);color:var(--bad)}
.list li.lrow2 button[data-id]{padding-right:36px}
.list li.delrow{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bad-bg);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.list li.delrow div{display:flex;gap:6px}
.list li button[data-id]{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.list li button[data-id]:hover{background:var(--sunk)}
.list li button[data-id][aria-current="true"]{background:var(--accent-weak)}
.list .t{font-weight:600;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .m{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.list .empty{padding:18px 14px;color:var(--muted);font-size:12.5px}
.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;line-height:18px;white-space:nowrap}
.s-draft{background:var(--sunk);color:var(--muted)}
.s-review{background:var(--info-bg);color:var(--info)}
.s-final{background:var(--ok-bg);color:var(--ok)}
.s-live{background:var(--accent);color:var(--accent-fg)}

/* editor */
.editor{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:13px;margin:0 0 12px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.sample{background:var(--warn-bg);color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea,.row input,.row select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:60px}
.row{display:grid;gap:8px;align-items:center}
.landings .row{grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) 130px 120px 30px;padding:6px 0;border-bottom:1px dashed var(--line)}
.landings .head{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
@media (max-width:760px){.landings .row{grid-template-columns:1fr 1fr}.landings .head{display:none}}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.track-yes{color:var(--ok)}.track-part{color:var(--warn)}.track-no{color:var(--bad)}

.copy-field{border-top:1px solid var(--line);padding:12px 0}
.copy-field:first-of-type{border-top:0;padding-top:0}
.copy-field .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.copy-field .hd b{font-size:13px}
.copy-field .hd .spec{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px 8px;align-items:center;margin-top:10px}
.item .lrow{grid-column:1/-1;display:flex;gap:8px;align-items:center;min-width:0}
.item .lrow:empty{display:none}
.item .lk{font-size:11.5px;color:var(--muted);flex:none;width:30px}
.item .lrow input{flex:1;font-size:12.5px;padding:5px 9px;font-family:var(--f-mono)}
.item input,.item select,.item textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.item textarea{resize:vertical;min-height:40px}
.cnt{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cnt.over{color:var(--bad);font-weight:600}
.cnt.near{color:var(--warn)}
.item.over input,.item.over textarea{border-color:var(--bad)}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox .thumb.up{display:grid;place-items:center;cursor:pointer;font-size:12px;color:var(--muted);text-align:center;border-style:dashed}
.imgbox .thumb.up.has{border-style:solid;color:transparent}
.imgbox .thumb.up:hover,.imgbox .thumb.drag{border-color:var(--accent);color:var(--accent)}
.imgbox .thumb{width:120px;aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--sunk);background-size:cover;background-position:center;border:1px solid var(--line)}

.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:13px}
.ck .ic{font-family:var(--f-mono);font-weight:700;width:18px;flex:none;text-align:center}
.ck.ok{background:var(--ok-bg);color:var(--ok)}
.ck.warn{background:var(--warn-bg);color:var(--warn)}
.ck.bad{background:var(--bad-bg);color:var(--bad)}
.ck.man{background:var(--sunk);color:var(--fg);cursor:pointer}
.ck.man input{margin-top:3px}
.cklbl{font-size:12.5px;font-weight:700;margin:12px 0 6px}.cklbl span{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.score{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.measure{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.meter{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:16px;flex:none}
.measure p{margin:0 0 6px}
.measure .small{font-size:12.5px;color:var(--muted)}

/* preview */
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px}
@media (max-width:1100px){.preview-col{position:static}}
.phone{width:100%;max-width:340px;margin:0 auto;border:10px solid var(--fg);border-radius:30px;background:var(--phone);color:var(--phone-fg);overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.phone .sb{display:flex;gap:8px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--phone-line)}
.phone .sb .q{flex:1;border:2px solid #03c75a;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phone .body{padding:12px;display:flex;flex-direction:column;gap:9px;min-height:380px}
.pv-ad{font-size:10.5px;color:var(--phone-muted);display:flex;gap:6px;align-items:center}
.pv-ad i{font-style:normal;border:1px solid var(--phone-line);border-radius:3px;padding:0 4px}
.pv-img{width:100%;aspect-ratio:var(--ratio,16/9);max-width:100%;border-radius:8px;background:var(--phone-chip);background-size:cover;background-position:center;display:grid;place-items:center;font-size:11px;color:var(--phone-muted);text-align:center;padding:8px}
.pv-title{font-size:15px;font-weight:700}
.pv-head{font-size:16px;color:var(--phone-link);font-weight:600;line-height:1.35}
.pv-desc{font-size:13px;color:var(--phone-muted);line-height:1.45}
.pv-btns{display:grid;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));border:1px solid var(--phone-line);border-radius:6px;overflow:hidden}
.pv-btns span{font-size:12px;color:var(--phone-link);text-align:center;padding:10px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--phone-line)}
.pv-btns span:last-child{border-right:0}
.pv-btns.c2 span:nth-child(2n){border-right:0}
.pv-btns.c2 span:nth-child(-n+2){border-bottom:1px solid var(--phone-line)}
.pv-thumbs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.pv-thumbs div{display:flex;flex-direction:column;gap:4px;font-size:11.5px;text-align:center}
.pv-thumbs div::before{content:"";aspect-ratio:1;border-radius:6px;background:var(--im,none) center/cover,var(--phone-chip)}
.pv-empty{color:var(--phone-muted);opacity:.6}
.pv-over{outline:2px solid #e5484d;outline-offset:1px;border-radius:3px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:8px;margin-bottom:14px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted);font-size:13px}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pv-home{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--phone-line)}
.pv-home span{flex:1;color:var(--phone-link);font-weight:600;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pv-home i{font-style:normal;font-size:10px;color:var(--phone-muted);border:1px solid var(--phone-line);border-radius:8px;padding:0 6px}
.pv-home .logo{width:22px;height:22px;border-radius:50%;background:var(--phone-chip);font-size:7px;color:var(--phone-muted);display:grid;place-items:center;font-weight:500;flex:none}
.pv-list{display:flex;flex-direction:column;gap:12px}
.pv-list .row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.pv-list .lt{color:var(--phone-link);font-weight:700;font-size:13.5px}
.pv-list .ld{font-size:12px;color:var(--phone-fg);line-height:1.4;white-space:pre-line}
.pv-list .ic{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--phone-link)}
.pv-list .ic i{width:14px;height:14px;border-radius:3px;background:var(--phone-link);opacity:.85}
.pv-sns{display:flex;gap:8px;align-items:center;font-size:12.5px;padding-top:9px;border-top:1px solid var(--phone-line)}
.pv-sns b{color:var(--phone-link);flex:none}
.pv-sns span:not(.chev){flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pv-sns .chev{color:var(--phone-muted)}
.grp{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.grp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.grp-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grp-hd b{font-size:14px}
.grp .seg{margin-bottom:6px}
.tabblk{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.tabblk:first-of-type{border-top:0;padding-top:0}
.tabsep{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:4px 0;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);text-align:left}
.tabsep .car{width:12px;font-size:11px}
.tabsep .tsum{font-weight:400;color:var(--muted);margin-left:4px}
.tabsep:hover{opacity:.8}
.item.withimg{grid-template-columns:56px minmax(0,1fr) 64px;margin-left:14px}
.item.withimg .ithumb{grid-row:span 2}
.item.withimg .lrow{grid-column:2/-1}
.ithumb{width:56px;height:56px;border-radius:6px;border:1px dashed var(--line);background:var(--sunk) center/cover;display:grid;place-items:center;font-size:10.5px;color:var(--muted);cursor:pointer;text-align:center}
.ithumb.has{border-style:solid;color:transparent}
.ithumb:hover{border-color:var(--accent);color:var(--accent)}
.subopt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.subopt>span{font-size:12px;color:var(--muted)}
.seg.sm{margin:0;padding:3px}.seg.sm button{padding:4px 10px;font-size:12px;flex:0 1 auto}
.grp .copy-field{border-top:0;padding:8px 0 4px}
.grp .copy-field+.copy-field{border-top:1px dashed var(--line);margin-top:10px;padding-top:12px}
.pv-news{display:flex;align-items:center;gap:6px;font-size:12.5px;padding-bottom:9px;border-bottom:1px solid var(--phone-line)}
.pv-news b{color:var(--phone-link);font-weight:700;flex:none}
.pv-news span:not(.chev){flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pv-news .chev{color:var(--phone-muted)}
.pv-main{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.pv-mimg{aspect-ratio:1;border-radius:8px;background:var(--phone-chip);background-size:cover;background-position:center;display:grid;place-items:center;font-size:10px;color:var(--phone-muted);text-align:center;padding:4px;overflow:hidden}
.pv-mtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.pv-mbrand{font-size:11px;color:#e5484d;font-weight:600}
.pv-mtitle{font-size:15.5px;font-weight:700;line-height:1.3}
.pv-mdesc{font-size:12.5px;color:var(--phone-muted);line-height:1.4}
.pv-legal{font-size:10.5px;color:var(--phone-muted);line-height:1.4}
.pv-tabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:var(--phone-chip);border-radius:8px;padding:3px}
.pv-tabs div{text-align:center;font-size:12.5px;padding:8px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--phone-muted)}
.pv-tabs div.on{color:var(--phone-fg);font-weight:700;background:var(--phone);border-radius:6px}
.pv-tabbody{background:var(--phone-chip);border-radius:6px;font-size:11px;color:var(--phone-muted);text-align:center;padding:22px 8px}
.pv-flick{display:grid;grid-auto-flow:column;grid-auto-columns:29%;gap:6px;overflow:hidden}
.pv-flick div{display:flex;flex-direction:column;gap:4px;font-size:11.5px;min-width:0;text-align:center}
.pv-flick div::before{content:"";aspect-ratio:1;border-radius:6px;background:var(--im,none) center/cover,var(--phone-chip)}
.pv-flick span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pv-note{font-size:11.5px;color:var(--muted);text-align:center}

/* settings */
.settings .tpl{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.settings .tpl-hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.settings .tpl-hd input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 9px;font-weight:600}
.settings .frow{display:grid;grid-template-columns:minmax(0,1.2fr) 110px 70px 60px minmax(0,1.4fr) 30px;gap:6px;margin-top:6px;align-items:center}
.settings .frow input,.settings .frow select,.settings .tpl-hd select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 7px;width:100%;min-width:0;font-size:12.5px}
.settings .fhead{font-size:11px;color:var(--muted)}
@media (max-width:760px){.settings .frow{grid-template-columns:1fr 1fr 1fr}.settings .fhead{display:none}}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.sv-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.sv-state span:not(.chip){color:var(--muted);font-size:12px}
.sv-off{font-size:12px;color:var(--muted)}
.savebar .btn.primary:disabled{opacity:.4;cursor:not-allowed}
.savebar .btn.primary{padding:9px 18px;font-size:14px}
.fi{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.fi.intab{margin-left:14px}
.fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.fbody input,.fbody textarea,.fbody select{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;width:100%;min-width:0;font-size:13.5px}
.fbody input::placeholder,.fbody textarea::placeholder{color:#a3aaa7}
.fl{font-size:12.5px;font-weight:700;color:var(--fg);margin-top:4px}
.fsub{font-size:12px;font-weight:600;color:var(--accent)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}
.trow.over input,.trow.over textarea{border-color:var(--bad)}
.lk2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px}
.lk2 input{font-family:var(--f-mono);font-size:12.5px}
.ferr{font-size:12px;color:#e5484d;line-height:1.3}
.fi.withimg .ithumb{flex:none;margin-top:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:9}

 {id:"light-thumb",name:"기본(3구 섬네일)",dyn:true,countMode:"char",fields:[...BASE,{id:"ext",group:"sub",label:"섬네일",type:"thumbs",max:7,count:3,note:DT},...TAIL]},
 {id:"light-tab",name:"탭",dyn:true,countMode:"char",fields:[...BASE,{id:"ext_tab",group:"sub",label:"탭 메뉴",type:"tabs",max:7,count:3,note:"",countOpt:"tabN",nolink:true},{id:"ext",group:"sub",label:"섬네일",type:"thumbs",max:7,count:9,note:"탭별 3개 · "+DT,countOpt:"tabN",countMul:3,perTab:true},...TAIL]},
 {id:"light-flick",name:"플리킹",dyn:true,countMode:"char",fields:[...BASE,{id:"ext",group:"sub",label:"플리킹 섬네일",type:"flick",max:7,count:5,note:DT,countOpt:"flickN"},...TAIL]}

function condOK(f,o){if(!f.cond)return true;const m=f.cond.match(/^(\w+)(!=|=)(\w+)$/);if(!m)return true;const v=(o||{})[m[1]]??DEF_OPTS[m[1]];return m[2]==="="?v===m[3]:v!==m[3]}
function eff(f,o){if(!f.countOpt)return f;const n=+((o||{})[f.countOpt]||DEF_OPTS[f.countOpt]);return {...f,count:n*(f.countMul||1),max:(f.maxBy&&f.maxBy[n])||f.max}}
function vis(p,t){return t.fields.filter(f=>condOK(f,p.opts)).map(f=>eff(f,p.opts))}
function vals(p,f){return (p.values[f.id]||[]).slice(0,f.count)}
const MANUAL=[
 ["lp","모든 랜딩 URL을 직접 열어 기획전 페이지가 노출되는지 확인"],
 ["img","이미지 내 텍스트 가독성(모바일 축소 상태) 확인"]];
const SUPER=/(최고|최초|최상|최저가?|유일|1위|1등|No\.?\s?1|넘버원|100\s?%|완벽|무조건|역대급)/gi;
const REPEAT=/([!?★☆♥~])\1/;

let downloads=null;
let db=null, assets=null, plans=[], templates=DEFAULT_TEMPLATES, currentId=null, cur=null, isSample=true;

}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));

function len(s,mode){s=String(s||"");if(mode==="byte"){let n=0;for(const ch of s){n+=/[\u0000-\u007f]/.test(ch)?1:2}return n}return [...s].length}

function ensureValues(p){
  const t=templates.find(x=>x.id===p.templateId)||templates[0];
  p.templateId=t.id;p.values=p.values||{};p.opts={...DEF_OPTS,...(p.opts||{})};if(p.opts.sns==="on")p.opts.sns="insta";
  for(const [o,n] of [["title","mt_brand"],["head","mt_title"],["desc","mt_desc"]])if(p.values[o]&&!p.values[n]){p.values[n]=p.values[o];delete p.values[o]}
  for(const f of t.fields){const arr=p.values[f.id]||[];const LM=Object.fromEntries((p.landings||[]).map(l=>[l.id,l.url]));arr.forEach(it=>{if(it.url==null)it.url=LM[it.landing]||"";delete it.landing});while(arr.length<f.count)arr.push({text:"",url:""});p.values[f.id]=arr.slice(0,Math.max(f.count,1))}
  return p;
}

/* ---------- analysis ---------- */
function analyze(p){
  const t=templates.find(x=>x.id===p.templateId)||templates[0];
  const res=[];let over=0;const emptyN=[],noImg=[];const VF=vis(p,t);
  for(const f of VF){
    vals(p,f).forEach((it,i)=>{
      const nm=f.perTab?`탭${Math.floor(i/3)+1} ${f.label} ${i%3+1}`:f.label+(f.count>1?" "+(i+1):"");
      if(f.type==="image"){if(!p.image?.url)noImg.push(nm);return}
      if(["thumbs","flick"].includes(f.type)&&!it.img?.url)noImg.push(nm);
      const n=len(it.text,t.countMode);
      if(!String(it.text||"").trim())emptyN.push(nm);
      else if(f.max&&n>f.max){over++;res.push(["bad",`${nm} ${n}/${f.max}자 초과`])}
    });
  }
  const list=a=>`${a.slice(0,4).join(", ")}${a.length>4?` 외 ${a.length-4}곳`:""}`;
  if(emptyN.length)res.push(["bad",`비어 있는 영역 ${emptyN.length}곳: ${list(emptyN)}`]);
  else res.push(["ok","모든 텍스트 영역 입력 완료"]);
  if(!over&&!emptyN.length)res.push(["ok","글자수 제한 이내"]);
  if(noImg.length)res.push(["warn",`이미지 미첨부 ${noImg.length}곳: ${list(noImg)}`]);
  else res.push(["ok","이미지 첨부 완료"]);
  const all=VF.flatMap(f=>vals(p,f).map(i=>i.text||"")).join(" ");
  const sup=[...new Set((all.match(SUPER)||[]))];
  if(sup.length)res.push(["bad",`검수 리스크 표현: ${sup.join(", ")} → 객관적 근거 자료 필요`]);
  if(REPEAT.test(all))res.push(["bad","특수문자 반복 사용 (검수 반려 가능)"]);
  if(/%|할인|특가|세일|원\b/.test(all)&&!(p.start&&p.end))res.push(["bad","할인·가격 표현이 있는데 집행 기간이 비어 있음"]);
  const its=VF.filter(f=>!f.nolink).flatMap(f=>f.oneLink?[{text:vals(p,f).map(x=>x.text||"").join(""),url:vals(p,f)[0]?.url}]:f.type==="image"?(p.image?.url?[{text:"img",url:vals(p,f)[0]?.url}]:[]):vals(p,f));
  const noLanding=its.filter(i=>i.text&&!String(i.url||"").trim()).length;
  if(noLanding)res.push(["bad",`랜딩 미입력 영역 ${noLanding}곳`]);
  const badUrl=its.filter(i=>String(i.url||"").trim()&&!/^https?:\/\/[^/]+\.[^/]+/.test(i.url)).length;
  if(badUrl)res.push(["bad",`URL 형식 확인 필요 ${badUrl}곳`]);
  const sv=VF.some(f=>f.id==="sns")?String((vals(p,{id:"sns",count:1})[0]||{}).text||"").trim():"";
  if(sv&&p.opts.sns==="blog"&&!/^(https?:\/\/)?(m\.)?blog\.naver\.com\/[^\s/]+/.test(sv))res.push(["bad","블로그 주소는 blog.naver.com/아이디 형식으로 입력하세요"]);
  if(sv&&p.opts.sns==="insta"&&!/^@[A-Za-z0-9._]{1,30}$/.test(sv))res.push(["bad","인스타그램 계정명은 @계정명 형식으로 입력하세요"]);
  return res;
}
function tracking(p){
  const t=templates.find(x=>x.id===p.templateId)||templates[0];
  const items=t.fields.filter(f=>f.type!=="image").flatMap(f=>(p.values[f.id]||[]).filter(i=>i.text));
  const map=Object.fromEntries(p.landings.map(l=>[l.id,l.track]));
  const c={yes:0,part:0,no:0};items.forEach(i=>{const k=map[i.landing];if(k)c[k]++});
  const total=c.yes+c.part+c.no;
  const share=total?Math.round(c.yes/total*100):0;
  let mode,kpi;
  if(!total){mode="none";kpi=""}
  else if(c.yes===total){mode="full";kpi="전환수·CPA·ROAS (소재 단위 비교 가능)"}
  else if(c.yes+c.part===0){mode="click";kpi="영역별 클릭 분포 · 전체 CTR · 클릭당 비용(계약금÷클릭) · 집행 전후 브랜드 키워드 검색량"}
  else{mode="mixed";kpi="추적 가능 랜딩은 전환 지표, 나머지는 영역별 클릭 분포·CTR로 분리 평가"}
  return {c,total,share,mode,kpi};
}

function renderList(){
  const q=$("#q").value.trim().toLowerCase();
  const rows=plans.filter(p=>!q||String(p.title||"").toLowerCase().includes(q));
  const ul=$("#planList");
  if(!db){ul.innerHTML=`<li class="empty">저장소에 연결하면 팀 기획안이 여기에 표시됩니다. 지금은 예시만 볼 수 있어요.</li>`;return}
  if(!plans.length){ul.innerHTML=`<li class="empty">아직 기획안이 없습니다.<br>오른쪽 위 <b>+ 새 기획안</b>으로 첫 기획안을 만들거나, 예시를 그대로 저장해 시작하세요.</li>`;return}
  if(!rows.length){ul.innerHTML=`<li class="empty">조건에 맞는 기획안이 없습니다.</li>`;return}
  ul.innerHTML=rows.map(p=>{const tn=(templates.find(x=>x.id===p.templateId)||{}).name||"";
    if(pendingDel===p._id)return `<li class="delrow"><span>'${esc(p.title||"제목 없음")}' 삭제할까요?</span><div><button type="button" class="btn danger" data-delyes="${p._id}">삭제</button><button type="button" class="btn ghost" data-delno="1">취소</button></div></li>`;
    return `<li class="lrow2"><button type="button" class="del" data-del="${p._id}" aria-label="${esc(p.title||"기획안")} 삭제" title="삭제">×</button><button type="button" data-id="${p._id}" aria-current="${p._id===currentId}"><span class="t">${esc(p.title||"제목 없음")}</span>
    <span class="m">${p.updatedAt?`저장 ${new Date(p.updatedAt).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})} · `:""}${p.start?`${esc(p.start.slice(5))} ~ ${esc((p.end||"").slice(5))}`:"기간 미정"}${tn?` · ${esc(tn)}`:""}</span></button></li>`}).join("");
}

function opt(list,val){return list.map(([v,l])=>`<option value="${v}"${v===val?" selected":""}>${l}</option>`).join("")}

function renderEditor(){
  const p=cur,t=tpl();
  const res=analyze(p);
  const ferr=m=>m?`<div class="ferr">${m}</div>`:"";
  const urlRow=(f,i,it)=>{const u=it.url||"",proto=it.proto||(u.startsWith("http://")?"http://":"https://"),rest=u.replace(/^https?:\/\//,"");
    return `<div class="fl">링크</div><div class="lk2"><select data-proto="${f.id}" data-i="${i}" aria-label="프로토콜">${opt([["https://","https://"],["http://","http://"]],proto)}</select><input data-u="${f.id}" data-i="${i}" value="${esc(rest)}" placeholder="주소 입력" aria-label="${esc(f.label)} ${i+1} 링크"></div>${ferr(!rest?"필수 항목입니다.":!/^[^\/\s]+\.[^\s]+/.test(rest)?"URL 형식을 확인하세요.":"")}`};
  const textRow=(f,i,it,multi,lab)=>{const n=len(it.text,t.countMode),ov=f.max&&n>f.max,near=f.max&&!ov&&n>=f.max*0.9,ph=f.max?`1~${f.max}${t.countMode==="byte"?"byte":"자"} 내 입력 가능`:"";
    const ctl=multi?`<textarea data-v="${f.id}" data-i="${i}" aria-label="${esc(lab)}" rows="2" placeholder="${ph}">${esc(it.text)}</textarea>`:`<input data-v="${f.id}" data-i="${i}" value="${esc(it.text)}" aria-label="${esc(lab)}" placeholder="${ph}">`;
    return `<div class="fl">텍스트</div><div class="trow${ov?" over":""}">${ctl}<span class="cnt${ov?" over":near?" near":""}" data-c="${f.id}-${i}">${n}/${f.max||"–"}</span></div>${ferr(!String(it.text||"").trim()?"1자 이상 입력하세요.":ov?`최대 ${f.max}자까지 입력 가능합니다.`:"")}`};
  const VF=vis(p,t);
  const IMGT=["thumbs","flick"];
  const tabF=VF.find(x=>x.type==="tabs");
  const fieldHtml=f=>{
    if(f.type==="tabs"&&VF.some(x=>x.perTab))return "";
    if(f.plain){const it=vals(p,f)[0]||{text:""},bl=p.opts.sns==="blog",lab=bl?"블로그 주소":"인스타그램 계정명";
      return `<div class="copy-field"><div class="hd"><b>${lab}</b></div><div class="fi"><div class="fbody"><input data-v="${f.id}" data-i="0" value="${esc(it.text)}" aria-label="${lab}" placeholder="${bl?"https://blog.naver.com/아이디":"@계정명"}">${ferr(String(it.text||"").trim()?"":"필수 항목입니다.")}</div></div></div>`}
    if(f.type==="image"){
      const it=p.values[f.id][0];
      return `<div class="copy-field"><div class="hd"><b>${esc(f.label)}</b><span class="spec">${esc(f.note||"")}</span></div>
      <div class="imgbox"><label class="thumb up${p.image?.url?" has":""}" id="imgDrop" title="이미지 업로드" style="${p.image?.url?`background-image:url('${esc(p.image.url)}')`:""}">${p.image?.url?"":"+ 이미지<br>업로드"}<input type="file" id="imgUp" accept="image/png,image/jpeg" hidden></label>

    }
    const multi=["lsdesc","legal"].includes(f.type);
    const items=vals(p,f).map((it,i)=>{
      const wi=IMGT.includes(f.type);
      const tabHd=f.perTab&&i%3===0&&tabF?(()=>{const k=i/3,tv=vals(p,tabF)[k]||{text:""};const cl=closedTabs.has(k),filled=vals(p,f).slice(k*3,k*3+3).filter(x=>String(x.text||"").trim()).length;
        return `<div class="tabblk"><button type="button" class="tabsep" data-tabtog="${k}" aria-expanded="${!cl}"><span class="car">${cl?"▸":"▾"}</span>탭 메뉴 ${k+1}${cl?`<span class="tsum">${tv.text?esc(tv.text)+" · ":""}섬네일 ${filled}/3 입력</span>`:""}</button>${cl?"":`<div class="fi" style="margin-top:4px"><div class="fbody">${textRow(tabF,k,tv,false,`탭 메뉴 ${k+1}`)}</div></div>`}</div>`})():"";
      if(f.perTab&&closedTabs.has(Math.floor(i/3)))return tabHd;
      const thumb=wi?`<label class="ithumb${it.img?.url?" has":""}" title="이미지 업로드" style="${it.img?.url?`background-image:url('${esc(it.img.url)}')`:""}">${it.img?.url?"":"+ 이미지"}<input type="file" data-img="${f.id}" data-i="${i}" accept="image/png,image/jpeg" hidden></label>`:"";
      const sub=f.oneLink?`${i+1})`:f.perTab?`섬네일 ${i%3+1}`:f.count>1?`${f.label} ${i+1}`:"";
      const link=f.nolink||(f.oneLink&&i<f.count-1)?"":(f.oneLink?urlRow(f,0,vals(p,f)[0]):urlRow(f,i,it));
      return `${tabHd}<div class="fi${wi?" withimg":""}${f.perTab?" intab":""}">${thumb}<div class="fbody">${sub?`<div class="fsub">${esc(sub)}</div>`:""}${textRow(f,i,it,multi,sub||f.label)}${link}</div></div>`}).join("");
    return `<div class="copy-field"><div class="hd"><b>${esc(f.label)}</b><span class="spec">최대 ${f.max}${t.countMode==="byte"?"byte":"자"}${f.count>1?` × ${f.count}개`:""}${f.note?" · "+esc(f.note):""}</span></div>${items}</div>`;
  };
  const fieldsHtml=GROUPS.map(g=>{
    const dynT=templates.filter(x=>x.dyn), isDyn=!!t.dyn;
    const opts=g.k==="sub"?[[(templates.find(x=>!x.dyn)||templates[0]).id,"버튼"],[isDyn?t.id:(dynT[0]||{}).id,"다이나믹 섬네일"]]:g.opts, val=g.k==="sub"?t.id:p.opts[g.k];
    const cntSeg=(k,arr,lab)=>`<div class="subopt"><span>${lab}</span><div class="seg sm" role="radiogroup" aria-label="${lab}">${arr.map(([n,l])=>`<button type="button" role="radio" aria-checked="${String(p.opts[k])===n}" data-opt="${k}:${n}">${l}</button>`).join("")}</div></div>`;
    const subExtra=g.k!=="sub"?"":(isDyn?`<div class="subopt"><span>구성</span><div class="seg sm" role="radiogroup" aria-label="다이나믹 섬네일 구성">${dynT.map(x=>`<button type="button" role="radio" aria-checked="${x.id===t.id}" data-tplsel="${x.id}">${esc(x.name)}</button>`).join("")}</div></div>`:"")
      +(t.fields.some(f=>f.countOpt==="btnN")?cntSeg("btnN",[["1","1개 · 19자"],["2","2개 · 9자"],["3","3개 · 7자"],["4","4개 · 9자"]],"버튼 개수"):"")
      +(t.fields.some(f=>f.countOpt==="tabN")?cntSeg("tabN",[["2","2개 (섬네일 6)"],["3","3개 (섬네일 9)"]],"탭 개수").replace(/<\/div><\/div>$/,`</div><button type="button" class="btn ghost" data-tabtogall="1" style="padding:4px 8px;font-size:12px">${closedTabs.size>=+p.opts.tabN?"모두 펼치기":"모두 접기"}</button></div>`):"")
      +(t.fields.some(f=>f.countOpt==="flickN")?cntSeg("flickN",[["4","4개"],["5","5개"]],"섬네일 개수"):"");
    const fs=VF.filter(f=>f.group===g.k);
    return `<div class="grp"><div class="grp-hd"><b>${g.name}</b><span class="chip ${g.req?"s-review":"s-draft"}">${g.req?"필수":"선택"}</span></div>
      <div class="seg" role="radiogroup" aria-label="${g.name} 옵션">${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${g.k==="sub"?(v===val||(isDyn&&l==="다이나믹 섬네일")):v===val}" data-${g.k==="sub"?"tplsel":"opt"}="${g.k==="sub"?v:g.k+":"+v}">${esc(l)}</button>`).join("")}</div>
      ${subExtra}
      ${fs.map(fieldHtml).join("")}</div>`;
  }).join("");

  const manualHtml=MANUAL.map(([k,l])=>`<label class="ck man"><input type="checkbox" data-m="${k}"${p.manual?.[k]?" checked":""}><span>${l}</span></label>`).join("");
  const ic={ok:"✓",warn:"!",bad:"✕"};
  const nBad=res.filter(r=>r[0]==="bad").length,nWarn=res.filter(r=>r[0]==="warn").length,nMan=MANUAL.filter(([k])=>p.manual?.[k]).length;

  $("#editor").innerHTML=`
  ${isSample?`<div class="banner sample"><b>${p._new?"새 기획안":"예시 기획안"}</b><span>${p._new?"아직 저장 전이에요.":"저장되지 않은 샘플이에요."} 소재를 다 작성하면 아래 <b>저장하기</b>를 누르세요.</span></div>`:""}

    <div class="fields">

  <section class="card"><h2>내보내기 <span class="hint">제작 요청·고객사 공유용 텍스트</span></h2>

      ${nBad?`<span class="chip" style="background:var(--bad-bg);color:var(--bad)">오류 ${nBad}</span>`:""}${nWarn?`<span class="chip" style="background:var(--warn-bg);color:var(--warn)">주의 ${nWarn}</span>`:""}${!nBad&&!nWarn?`<span class="chip s-final">검수 통과</span>`:""}</div>
    <div class="spacer"></div>
    ${!isSample&&db?(confirmDel?`<span class="confirm">이 기획안을 삭제할까요? <button class="btn danger" type="button" id="btnDelYes">삭제</button><button class="btn ghost" type="button" id="btnDelNo">취소</button></span>`:`<button class="btn ghost danger" type="button" id="btnDel">삭제</button>`):""}
    ${db?`${nBad?`<span class="sv-off">오류를 해결하면 저장할 수 있어요</span>`:""}<button class="btn primary" type="button" id="btnSaveNow"${nBad?" disabled":""}>${isSample?"저장하기":"지금 저장"}</button>`:`<span class="sv-off">저장소에 연결되면 저장할 수 있어요</span>`}
  </div>`;
  renderPreview();

function renderPreview(){
  const p=cur,t=tpl();
  const VF=vis(p,t),by=ty=>VF.filter(f=>f.type===ty);
  const v=f=>vals(p,f);
  const cell=(f,it)=>{const tx=(it&&it.text)||"",ov=f.max&&len(tx,t.countMode)>f.max;return `<span class="${tx?"":"pv-empty"}${ov?" pv-over":""}">${esc(tx||f.label.split("· ").pop())}</span>`};
  const one=ty=>{const f=by(ty)[0];return f?cell(f,v(f)[0]):""};
  const has=ty=>{const f=by(ty)[0];return f&&String(v(f)[0]?.text||"").trim()};
  const bnF=by("mtbrand")[0]||by("title")[0];
  const hF=by("homelink")[0],hq=hF?String(v(hF)[0]?.text||"").replace(/\s*(공식\s*)?(홈페이지|스토어|몰)$/,""):"";
  $("#pvQuery").textContent=hq||(bnF&&v(bnF)[0]?.text)||"브랜드 키워드";
  const parts=[];
  if(by("homelink")[0])parts.push(`<div class="pv-home">${p.opts.home==="logo"?'<b class="logo">logo</b>':""}${one("homelink")}<i>광고</i></div>`);
  if(by("news")[0]&&has("news"))parts.push(`<div class="pv-news"><b>${NEWS_LABEL[p.opts.news]||"새소식"}</b>${one("news")}<span class="chev">›</span></div>`);
  const imgF=by("image")[0];
  const img=imgF?`<div class="pv-mimg" style="${p.image?.url?`background-image:url('${esc(p.image.url)}')`:""}">${p.image?.url?"":"메인 이미지"}</div>`:"";
  if(p.opts.main!=="listing")parts.push(`<div class="pv-main">${img}<div class="pv-mtext"><div class="pv-mbrand">${one("mtbrand")}</div><div class="pv-mtitle">${one("mttitle")}</div><div class="pv-mdesc">${(()=>{const f=by("mtdesc")[0];return f?v(f).map(it=>cell(f,it)).join("<br>"):""})()}</div></div></div>`);
  const lt=by("lstitle")[0],ld=by("lsdesc")[0],li=by("lsicon")[0];
  if(lt)parts.push(`<div class="pv-list">${v(lt).map((it,i)=>`<div class="row"><div class="tx"><div class="lt">${cell(lt,it)}</div><div class="ld">${ld?cell(ld,v(ld)[i]):""}</div></div><div class="ic"><i></i>${li?cell(li,v(li)[i]):""}</div></div>`).join("")}</div>`);
  for(const f of VF){
    const vals=v(f);
    if(f.type==="tabs")parts.push(`<div class="pv-tabs" style="--n:${Math.min(vals.length,5)}">${vals.map((it,i)=>`<div${i===0?' class="on"':""}>${cell(f,it)}</div>`).join("")}</div>`);
    else if(f.type==="thumbs")parts.push(`<div class="pv-thumbs" style="--n:3">${(f.perTab?vals.slice(0,3):vals).map(it=>`<div style="${it.img?.url?`--im:url('${esc(it.img.url)}')`:""}">${cell(f,it)}</div>`).join("")}</div>`);
    else if(f.type==="flick")parts.push(`<div class="pv-flick">${vals.map(it=>`<div style="${it.img?.url?`--im:url('${esc(it.img.url)}')`:""}">${cell(f,it)}</div>`).join("")}</div>`);
    else if(f.type==="buttons")parts.push(`<div class="pv-btns c${vals.length===4?2:vals.length}" style="--c:${vals.length===4?2:vals.length}">${vals.map(it=>cell(f,it)).join("")}</div>`);
  }
  const sf=by("sns")[0];if(sf){const sv=(v(sf)[0]||{}).text||"",bl=p.opts.sns==="blog";parts.push(`<div class="pv-sns"><b>${bl?"블로그":"인스타그램"}</b><span class="${sv?"":"pv-empty"}">${esc(sv||(bl?"blog.naver.com/아이디":"@계정명"))}</span><span class="chev">›</span></div>`)}
  if(by("legal")[0]&&has("legal"))parts.push(`<div class="pv-legal">${one("legal")}</div>`);
  $("#pvBody").innerHTML=parts.join("");
}

function xlsxRows(p){
  const t=templates.find(x=>x.id===p.templateId)||templates[0];
  const rows=[["영역","옵션","항목","순번","카피","글자수","최대","랜딩 URL"]];
  for(const f of vis(p,t)){
    if(f.type==="image")continue;
    const g=GROUPS.find(x=>x.k===f.group),og=g&&(g.k==="sub"?t.name:((g.opts||[]).find(o=>o[0]===p.opts[g.k])||[])[1]);
    const vs=vals(p,f);
    vs.forEach((it,i)=>{
      const tx=String(it.text||"").trim();if(!tx)return;
      const url=f.nolink?"":(f.oneLink?(vs[0]?.url||""):(it.url||""));
      const label=f.perTab?`탭${Math.floor(i/3)+1} ${f.label}`:f.label, no=f.perTab?i%3+1:(f.count>1?i+1:"");
      rows.push([g?g.name:"",og||"",label,no,tx,f.max?len(tx,t.countMode):"",f.max||"",url]);
    });
  }
  return rows;
}
async function exportXlsx(p){
  const rows=xlsxRows(p);
  if(rows.length<2){toast("작성된 영역이 없어요");return}
  const XL=window.XLSX;
  const info=[["기획전",p.title||""],["집행기간",`${p.start||"-"} ~ ${p.end||"-"}`],["추출일",new Date().toLocaleString("ko-KR")],[]];
  const ws=XL.utils.aoa_to_sheet([...info,...rows]);
  ws["!cols"]=[{wch:14},{wch:14},{wch:18},{wch:6},{wch:36},{wch:7},{wch:6},{wch:44}];
  const wb=XL.utils.book_new();XL.utils.book_append_sheet(wb,ws,"소재");
  const buf=XL.write(wb,{bookType:"xlsx",type:"array"});
  const name=`브랜드검색_${(p.title||"기획안").replace(/[\\/:*?"<>|]/g,"").slice(0,60)}.xlsx`;
  try{await downloads.save({filename:name,data:buf});toast("엑셀 파일을 저장했습니다")}
  catch(e){if(e?.code==="declined")return;toast(e?.code==="rate_limited"?"잠시 후 다시 시도해 주세요":"엑셀 파일을 저장하지 못했습니다")}
}
function exportText(p){
  const t=templates.find(x=>x.id===p.templateId)||templates[0];
  const lines=[`[브랜드검색 소재 기획안] ${p.title}`,`집행: ${p.start||"-"} ~ ${p.end||"-"}`,`템플릿: MO 라이트형 · ${GROUPS.filter(g=>g.opts).map(g=>g.name+" "+(g.opts.find(o=>o[0]===p.opts[g.k])||[])[1]).join(" / ")} / 서브 콘텐츠 ${t.name}`,"","■ 영역별 소재"];
  for(const f of vis(p,t)){vals(p,f).forEach((it,i)=>{const g=GROUPS.find(x=>x.k===f.group);lines.push(`- ${g?g.name+" · ":""}${f.label}${f.count>1?" "+(i+1):""}: ${f.type==="image"?(p.image?.url?"이미지 업로드됨":"(이미지 미업로드)"):(it.text||"(미입력)")}${f.type!=="image"&&f.max?` (${len(it.text,t.countMode)}/${f.max})`:""}${it.url?` → ${it.url}`:""}`)})}
  return lines.join("\n");
}

      <input data-ff="label" data-t="${ti}" data-f="${fi}" data-fid="${f.group==="sub"?"":f.id}" value="${esc(f.label)}" aria-label="영역명">
      <select data-ff="type" data-t="${ti}" data-f="${fi}" data-fid="${f.group==="sub"?"":f.id}" aria-label="유형">${opt(TYPES,f.type)}</select>
      <input data-ff="max" data-t="${ti}" data-f="${fi}" data-fid="${f.group==="sub"?"":f.id}" type="number" min="0" value="${f.max}" aria-label="최대 글자수">
      <input data-ff="count" data-t="${ti}" data-f="${fi}" data-fid="${f.group==="sub"?"":f.id}" type="number" min="1" max="8" value="${f.count}" aria-label="개수">
      <input data-ff="note" data-t="${ti}" data-f="${fi}" data-fid="${f.group==="sub"?"":f.id}" value="${esc(f.note||"")}" aria-label="비고">
      <button class="x" type="button" data-fdel="${ti}-${fi}" aria-label="영역 삭제">×</button></div>`).join("")}
    <button class="btn ghost" type="button" data-fadd="${ti}" style="margin-top:8px">+ 영역 추가</button></div>`).join("");
}

/* ---------- persistence ---------- */
function stripMeta(p){const o=clone(p);delete o._id;delete o._new;return o}
function scheduleSave(){
  lastLocalEdit=Date.now();
  if(isSample||!db||!currentId)return;
  setSync("저장 대기…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(analyze(cur).some(r=>r[0]==="bad")){setSync("오류 있음 · 해결하면 자동 저장");return}
    const id=currentId;cur.updatedAt=Date.now();const body=stripMeta(cur);
    saving=saving.then(()=>db.collection("plans").doc(id).set(body)).then(()=>setSync("저장됨 "+new Date().toTimeString().slice(0,5))).catch(e=>{setSync("저장 실패");toast("저장하지 못했습니다: "+(e?.message||e?.code||"권한 확인"))});
  },700);
}
async function createPlan(p){
  if(!db){toast("저장소에 연결되지 않아 저장할 수 없습니다");return}
  const body=stripMeta(p);body.createdAt=body.updatedAt=Date.now();
  try{const ref=db.collection("plans").doc();await ref.set(body);currentId=ref.id;cur=ensureValues({...body,_id:ref.id});isSample=false;showExport=false;confirmDel=false;renderEditor();renderList();toast("저장했습니다")}
  catch(e){toast(e?.code==="quota_exceeded"?"저장 공간이 가득 찼습니다. 오래된 기획안을 정리해 주세요":"저장하지 못했습니다. 편집 권한을 확인하세요")}
}
function select(id){
  const p=plans.find(x=>x._id===id);if(!p)return;
  clearTimeout(saveTimer);
  currentId=id;cur=ensureValues(clone(p));cur._id=id;isSample=false;showExport=false;confirmDel=false;renderEditor();renderList();
}

/* ---------- events ---------- */
function refreshLight(){ // update counters/preview without rebuilding focused inputs
  const t=tpl();
  for(const f of vis(cur,t)){vals(cur,f).forEach((it,i)=>{const el=document.querySelector(`[data-c="${f.id}-${i}"]`);if(!el)return;const n=len(it.text,t.countMode),ov=f.max&&n>f.max;el.textContent=`${n}/${f.max||"–"}`;el.className="cnt"+(ov?" over":f.max&&n>=f.max*.9?" near":"");el.parentElement.classList.toggle("over",!!ov)})}
  renderPreview();
  clearTimeout(refreshLight._t);refreshLight._t=setTimeout(()=>{const a=document.activeElement,id=a&&(a.id||a.dataset.v||a.dataset.u),pos=a&&a.selectionStart;
    const y=window.scrollY;renderEditor();window.scrollTo(0,y);
    if(id){let el=a.id?document.getElementById(a.id):a.dataset.v?document.querySelector(`[data-v="${a.dataset.v}"][data-i="${a.dataset.i}"]`):document.querySelector(`[data-u="${a.dataset.u}"][data-i="${a.dataset.i}"]`);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  },900);
}
function shrink(file,max=800){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function uploadImage(file,setFn,max=480){
  setFn=setFn||(img=>{cur.image=img});
  if(!/^image\/(png|jpe?g)$/.test(file.type)){toast("jpg 또는 png 이미지만 올릴 수 있어요");return}
  setSync("업로드 중…");
  try{
    if(assets){try{const r=await assets.upload(file);setFn({id:r.id,url:r.url});scheduleSave();renderEditor();setSync("업로드 완료");toast("이미지를 올렸습니다");return}catch(e){}}
    const url=await shrink(file,max);setFn({url});scheduleSave();renderEditor();setSync("업로드 완료");toast("이미지를 올렸습니다")
  }catch(e){setSync("업로드 실패");toast("이미지를 읽지 못했습니다. 다른 파일로 시도해 주세요")}
}
const ed=$("#editor");
ed.addEventListener("dragover",e=>{const d=e.target.closest("#imgDrop");if(d){e.preventDefault();d.classList.add("drag")}});
ed.addEventListener("dragleave",e=>{const d=e.target.closest("#imgDrop");if(d)d.classList.remove("drag")});
ed.addEventListener("drop",e=>{const d=e.target.closest("#imgDrop");if(d){e.preventDefault();d.classList.remove("drag");const f=e.dataTransfer.files[0];if(f)uploadImage(f)}});
ed.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.p){cur[el.dataset.p]=el.value;scheduleSave();if(["start","end"].includes(el.dataset.p))refreshLight();return}
  if(el.dataset.u){const it=cur.values[el.dataset.u][+el.dataset.i];let r=el.value.trim();const m=r.match(/^(https?:\/\/)/i);if(m){it.proto=m[1].toLowerCase();r=r.slice(m[1].length)}const pr=it.proto||(String(it.url||"").startsWith("http://")?"http://":"https://");it.proto=pr;it.url=r?pr+r:"";scheduleSave();refreshLight();return}
  if(el.dataset.v){cur.values[el.dataset.v][+el.dataset.i].text=el.value;scheduleSave();refreshLight();return}
  if(el.dataset.lp&&(el.dataset.lp==="name"||el.dataset.lp==="url")){cur.landings[+el.dataset.i][el.dataset.lp]=el.value;scheduleSave();refreshLight();return}
});
ed.addEventListener("change",async e=>{
  const el=e.target;
    if(el.dataset.proto){const it=cur.values[el.dataset.proto][+el.dataset.i];const r=String(it.url||"").replace(/^https?:\/\//,"");it.proto=el.value;it.url=r?el.value+r:"";scheduleSave();renderEditor();return}
  if(el.dataset.l){cur.values[el.dataset.l][+el.dataset.i].landing=el.value;scheduleSave();renderEditor();return}
  if(el.dataset.lp==="mall"){const l=cur.landings[+el.dataset.i];l.mall=el.value;l.track=(MALLS.find(m=>m[0]===el.value)||[])[2]||"no";scheduleSave();renderEditor();return}
  if(el.dataset.lp==="track"){cur.landings[+el.dataset.i].track=el.value;scheduleSave();renderEditor();return}
  if(el.dataset.m){cur.manual=cur.manual||{};cur.manual[el.dataset.m]=el.checked;scheduleSave();renderEditor();return}
  if(el.id==="imgUp"&&el.files[0]){await uploadImage(el.files[0])}
  if(el.dataset.img&&el.files[0]){const k=el.dataset.img,i=+el.dataset.i;await uploadImage(el.files[0],img=>{cur.values[k][i].img=img},240)}
});
ed.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tabtog!=null){const k=+b.dataset.tabtog;closedTabs.has(k)?closedTabs.delete(k):closedTabs.add(k);renderEditor();return}
  if(b.dataset.tabtogall){const n=+cur.opts.tabN;if(closedTabs.size>=n)closedTabs.clear();else for(let k=0;k<n;k++)closedTabs.add(k);renderEditor();return}
  if(b.dataset.opt){const[k,v]=b.dataset.opt.split(":");cur.opts[k]=v;scheduleSave();renderEditor();return}
  if(b.dataset.tplsel){cur.templateId=b.dataset.tplsel;ensureValues(cur);scheduleSave();renderEditor();return}
  if(b.id==="btnAddL"){cur.landings.push({id:uid(),name:"랜딩 "+(cur.landings.length+1),url:"",mall:"olive",track:"no"});scheduleSave();renderEditor()}
  else if(b.dataset.ldel!=null){const i=+b.dataset.ldel,gone=cur.landings[i].id;cur.landings.splice(i,1);for(const k in cur.values)cur.values[k].forEach(it=>{if(it.landing===gone)it.landing=cur.landings[0].id});scheduleSave();renderEditor()}
  else if(b.id==="btnKpi"){cur.kpi=tracking(cur).kpi;scheduleSave();renderEditor()}
  else if(b.id==="btnSaveSample"){await createPlan(cur)}
  else if(b.id==="btnSaveNow"){
    const nb=analyze(cur).filter(r=>r[0]==="bad").length;
    if(nb){toast(`검수 체크의 오류 ${nb}건을 먼저 해결해 주세요`);return}
    if(isSample){b.disabled=true;await createPlan(cur);if(nb)toast(`저장했습니다 (오류 ${nb}건은 확인이 필요해요)`);return}
    clearTimeout(saveTimer);b.disabled=true;setSync("저장 중…");
    const id=currentId;cur.updatedAt=Date.now();const body=stripMeta(cur);
    saving=saving.then(()=>db.collection("plans").doc(id).set(body)).then(()=>{setSync("저장됨 "+new Date().toTimeString().slice(0,5));toast(nb?`저장했습니다 (오류 ${nb}건은 확인이 필요해요)`:"저장했습니다");renderEditor();renderList()}).catch(e=>{setSync("저장 실패");b.disabled=false;toast("저장하지 못했습니다. 편집 권한을 확인하세요")});
  }
  else if(b.id==="btnShowExport"){showExport=!showExport;renderEditor()}
  else if(b.id==="btnXlsx"){await exportXlsx(cur);return}
  else if(b.id==="btnCopy"){const txt=exportText(cur);try{await navigator.clipboard.writeText(txt);toast("복사했습니다")}catch(err){showExport=true;renderEditor();const pre=$("#exportPre");const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("텍스트를 선택해 두었습니다. 복사(Ctrl/Cmd+C)하세요")}}
  else if(b.id==="btnDel"){confirmDel=true;renderEditor()}
  else if(b.id==="btnDelNo"){confirmDel=false;renderEditor()}
  else if(b.id==="btnDelYes"){await deletePlan(currentId);return}
  else if(b.id==="btnDelYesOld"){const id=currentId;clearTimeout(saveTimer);try{await saving;await db.collection("plans").doc(id).delete();currentId=null;cur=ensureValues(blank());cur._new=true;isSample=true;confirmDel=false;renderEditor();toast("삭제했습니다")}catch(err){toast("삭제하지 못했습니다. 권한을 확인하세요")}}
  else if(b.id==="btnDup"){const c=clone(cur);c.title=c.title+" (복제)";c.manual={};await createPlan(c)}
  else if(b.id==="imgDel"){cur.image=null;scheduleSave();renderEditor()}
});
$("#planList").addEventListener("click",async e=>{
  const d=e.target.closest("button[data-del]");if(d){pendingDel=d.dataset.del;renderList();return}
  if(e.target.closest("button[data-delno]")){pendingDel=null;renderList();return}
  const y=e.target.closest("button[data-delyes]");if(y){await deletePlan(y.dataset.delyes);return}
  const b=e.target.closest("button[data-id]");if(b){pendingDel=null;select(b.dataset.id)}});
$("#q").addEventListener("input",renderList);
$("#btnNew").addEventListener("click",()=>{clearTimeout(saveTimer);currentId=null;cur=ensureValues(blank());cur._new=true;isSample=true;showExport=false;confirmDel=false;renderEditor();renderList();window.scrollTo({top:0,behavior:"smooth"})});

$("#btnSettings").addEventListener("click",()=>{draftTpl=clone(templates);renderSettings();$("#settings").hidden=false;$("#settings").scrollIntoView({behavior:"smooth",block:"start"})});
$("#btnCloseSettings").addEventListener("click",()=>{$("#settings").hidden=true});
$("#btnAddTpl").addEventListener("click",()=>{draftTpl.push({id:"tpl-"+uid(),name:"새 템플릿",countMode:"char",fields:[{id:uid(),label:"헤드라인",type:"headline",max:20,count:1,note:""}]});renderSettings()});
const st=$("#tplList");
st.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.tn!=null)draftTpl[+el.dataset.tn].name=el.value;
  else if(el.dataset.ff){const f=draftTpl[+el.dataset.t].fields[+el.dataset.f];f[el.dataset.ff]=["max","count"].includes(el.dataset.ff)?Math.max(el.dataset.ff==="count"?1:0,Math.min(el.dataset.ff==="count"?8:999,+el.value||0)):el.value;
    if(el.dataset.fid){for(const t of draftTpl)for(const g of t.fields)if(g.id===el.dataset.fid&&g!==f)g[el.dataset.ff]=f[el.dataset.ff];
      document.querySelectorAll(`[data-ff="${el.dataset.ff}"][data-fid="${el.dataset.fid}"]`).forEach(x=>{if(x!==el)x.value=el.value})}}});
st.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.tm!=null)draftTpl[+el.dataset.tm].countMode=el.value;
  else if(el.dataset.ff==="type")draftTpl[+el.dataset.t].fields[+el.dataset.f].type=el.value});
st.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tdel!=null){draftTpl.splice(+b.dataset.tdel,1);renderSettings()}
  else if(b.dataset.fdel){const[t,f]=b.dataset.fdel.split("-").map(Number);draftTpl[t].fields.splice(f,1);renderSettings()}
  else if(b.dataset.fadd!=null){draftTpl[+b.dataset.fadd].fields.push({id:uid(),label:"새 영역",type:"desc",max:30,count:1,note:""});renderSettings()}});
$("#btnSaveTpl").addEventListener("click",async()=>{
  templates=clone(draftTpl);ensureValues(cur);renderEditor();
  if(!db){toast("이 화면에만 적용했습니다 (저장소 미연결)");return}
  try{await db.doc("config/mo_light_v4").set({templates,updatedAt:Date.now()});toast("팀 템플릿을 저장했습니다");$("#settings").hidden=true}
  catch(e){toast("템플릿을 저장하지 못했습니다. 편집 권한을 확인하세요")}
});

/* ---------- boot ---------- */
cur=ensureValues(blank());cur._new=true;
renderList();renderEditor();
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  try{assets=await window.claude?.use?.("assets")}catch(e){assets=null}
  try{downloads=await window.claude?.use?.("downloads")}catch(e){downloads=null}
  if(downloads)renderEditor();
  if(!db){setSync("오프라인 · 예시 모드");renderList();return}
  setSync("동기화됨");
  db.doc("config/mo_light_v4").onSnapshot(s=>{
    if(s.exists&&Array.isArray(s.data().templates)&&s.data().templates.length){templates=clone(s.data().templates).map(t=>({...t,fields:t.fields.map(f=>{const d=((DEFAULT_TEMPLATES.find(x=>x.id===t.id)||{}).fields||[]).find(x=>x.id===f.id)||[...BASE,...TAIL].find(x=>x.id===f.id);if(!d)return f;const o={...f};for(const k of ["label","type","count","cond","group","nolink","oneLink","countOpt","countMul","perTab","maxBy","plain"]){if(k in d)o[k]=d[k];else delete o[k]}if(f.count!==d.count)o.max=d.max;return o})}));ensureValues(cur);if(Date.now()-lastLocalEdit>2500)renderEditor()}
  },()=>{});
  db.collection("plans").orderBy("updatedAt","desc").onSnapshot(snap=>{
    plans=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(currentId){const p=plans.find(x=>x._id===currentId);
      if(!p){currentId=null;cur=ensureValues(blank());cur._new=true;isSample=true;renderEditor()}
      else if(Date.now()-lastLocalEdit>3000&&!snap.metadata.hasPendingWrites){const c=ensureValues(clone(p));c._id=currentId;if(JSON.stringify(stripMeta(c))!==JSON.stringify(stripMeta(cur))){cur=c;renderEditor()}}
    }
    renderList();
  },e=>{setSync("동기화 중단 · 새로고침 필요")});
  renderEditor();
})();
})();
</script>
